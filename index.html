<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>The Buzzer Show</title>
<style>
:root{color-scheme:dark;--red:#ed172b;--gold:#f7c95c}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#29202a 0,#101016 45%,#07070a 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
.app{width:min(100%,900px);min-height:100svh;padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:20px}
header{text-align:center;padding-top:8px}
.kicker{font-size:.72rem;letter-spacing:.35em;color:var(--gold);font-weight:800}
h1{margin:8px 0 3px;font-size:clamp(2rem,8vw,4rem);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 5px 28px #e7193344}
.sub{color:#aaa;font-size:.85rem;letter-spacing:.12em}
.round{align-self:center;border:1px solid #ffffff25;background:#ffffff0b;border-radius:999px;padding:8px 18px;color:#ddd;font-size:.78rem;letter-spacing:.16em}
.stage{position:relative;flex:1;min-height:420px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vw,26px);align-items:center}
.stage.single{grid-template-columns:minmax(0,1fr);max-width:540px;width:100%;align-self:center}
.buzzer-card{min-width:0;text-align:center}
.player{font-size:.85rem;letter-spacing:.2em;color:#ddd;margin-bottom:16px;font-weight:800}
.buzzer{width:100%;aspect-ratio:1/1;border:0;border-radius:50%;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 25%,#ff6670 0,#f21b31 32%,#a50015 72%,#5a0010 100%);box-shadow:inset 0 9px 15px #ffffff55,inset 0 -18px 25px #31000b99,0 14px 0 #51000d,0 24px 38px #000b;transition:transform .12s,filter .2s;max-width:340px}
.buzzer:before{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid #ffffff35;box-shadow:0 0 0 7px #00000012}
.buzzer:after{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid #ffffff30}
.buzzer span{position:relative;z-index:1;font-size:clamp(1rem,4vw,1.55rem);font-weight:1000;letter-spacing:.1em;text-shadow:0 2px 5px #65000c}
.buzzer:active{transform:translateY(9px) scale(.98);box-shadow:inset 0 9px 15px #ffffff55,inset 0 -18px 25px #31000b99,0 5px 0 #51000d,0 12px 20px #000b}
.buzzer:disabled{filter:grayscale(1);opacity:.24;cursor:not-allowed}
.buzzer-card small{display:block;color:#999;margin-top:25px;letter-spacing:.12em}
.status{text-align:center;min-height:55px;color:#ddd;font-weight:800;letter-spacing:.12em}
.status strong{color:var(--gold)}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
button.control{background:#ffffff10;border:1px solid #ffffff2b;border-radius:12px;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
button.control.primary{background:var(--red);border-color:var(--red)}
.settings{border:1px solid #ffffff20;background:#ffffff08;border-radius:16px;padding:16px;display:flex;gap:14px 22px;flex-wrap:wrap;justify-content:center;color:#ddd;font-size:.9rem}
.settings label{display:flex;align-items:center;gap:8px;cursor:pointer}
input{accent-color:var(--red);width:18px;height:18px}
.hint{text-align:center;color:#777;font-size:.75rem;line-height:1.5}
.x-overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#100006d9;backdrop-filter:blur(4px);animation:flash .55s ease-out}
.x-overlay.show{display:flex}
.big-x{font-size:min(78vw,70vh);font-weight:1000;line-height:1;color:#f20d28;text-shadow:0 0 15px #ff001f,0 0 55px #ff001f99;transform:scale(.2) rotate(-18deg);animation:slam .45s cubic-bezier(.15,1.5,.35,1) forwards}
.x-caption{position:absolute;bottom:15%;font-size:clamp(1rem,4vw,2rem);font-weight:900;letter-spacing:.2em;text-align:center;padding:0 16px}
@keyframes slam{to{transform:scale(1) rotate(0)}}
@keyframes flash{0%{background:#fff}100%{background:#100006d9}}
@media(max-width:520px){.app{padding:14px}.stage{min-height:300px;gap:10px}.player{font-size:.68rem}.buzzer-card small{font-size:.62rem;margin-top:18px}.settings{font-size:.8rem}}
</style>
</head>
<body>
<main class="app">
<header><div class="kicker">LIVE ON STAGE</div><h1>The Buzzer Show</h1><div class="sub">WHO'S GOT WHAT IT TAKES?</div></header>
<div class="round" id="roundLabel">ROUND 01</div>
<section class="stage" id="stage">
 <div class="buzzer-card" id="card1"><div class="player" id="name1">BUZZER ONE</div><button class="buzzer" id="buzz1" aria-label="Buzzer one"><span>BUZZ!</span></button><small>PRESS TO BUZZ</small></div>
 <div class="buzzer-card" id="card2"><div class="player" id="name2">BUZZER TWO</div><button class="buzzer" id="buzz2" aria-label="Buzzer two"><span>BUZZ!</span></button><small>PRESS TO BUZZ</small></div>
</section>
<div class="status" id="status" aria-live="polite">WAITING FOR THE PERFORMANCE…</div>
<div class="controls"><button class="control primary" id="reset">↻ RESET ROUND</button><button class="control" id="full">⛶ FULLSCREEN</button></div>
<section class="settings">
 <label><input type="checkbox" id="enable1" checked> Buzzer 1 enabled</label>
 <label><input type="checkbox" id="enable2" checked> Buzzer 2 enabled</label>
 <label><input type="checkbox" id="music" checked> Sad music</label>
 <label><input type="checkbox" id="sound" checked> Buzzer sound</label>
 <label><input type="checkbox" id="xEffect" checked> Big red X</label>
</section>
<div class="hint">Keyboard: 1 or A = Buzzer 1 · 2 or L = Buzzer 2 · Space = reset<br>Sound starts after your first tap, as required by your browser.</div>
</main>
<div class="x-overlay" id="overlay"><div class="big-x">X</div><div class="x-caption" id="caption">BUZZER ONE</div></div>
<script>
const $=id=>document.getElementById(id);
let locked=false, audioCtx=null, musicTimer=null, musicNodes=[];
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(){if(!$('sound').checked)return;const c=audio(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(125,c.currentTime);o.frequency.exponentialRampToValueAtTime(48,c.currentTime+.42);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.38,c.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.55);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.56)}
function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;musicNodes.forEach(n=>{try{n.stop()}catch(e){}});musicNodes=[]}
function sadMusic(){if(!$('music').checked)return;stopMusic();const c=audio();const notes=[196,174.61,146.83,164.81,130.81,146.83];let i=0;function note(){if(!audioCtx||audioCtx.state!=='running')return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.25);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+1.85);musicNodes.push(o)}note();musicTimer=setInterval(note,1250)}
function buzz(n){if(locked||!$('enable'+n).checked)return;locked=true;const label=$('name'+n).textContent; $('status').innerHTML='<strong>'+label+'</strong> BUZZED FIRST!';$('buzz1').disabled=true;$('buzz2').disabled=true;beep();sadMusic();if($('xEffect').checked){$('caption').textContent=label+' — X';$('overlay').classList.add('show')}}
function sync(){ $('buzz1').disabled=locked||!$('enable1').checked;$('buzz2').disabled=locked||!$('enable2').checked;$('card1').style.display=$('enable1').checked?'':'none';$('card2').style.display=$('enable2').checked?'':'none';$('stage').classList.toggle('single',!$('enable1').checked||!$('enable2').checked)}
function reset(){locked=false;stopMusic();$('overlay').classList.remove('show');$('status').textContent='WAITING FOR THE PERFORMANCE…';$('roundLabel').textContent='ROUND '+String((Number($('roundLabel').dataset.n||1)+1)).padStart(2,'0');$('roundLabel').dataset.n=Number($('roundLabel').dataset.n||1)+1;sync()}
$('buzz1').addEventListener('click',()=>buzz(1));$('buzz2').addEventListener('click',()=>buzz(2));$('reset').addEventListener('click',reset);
['enable1','enable2'].forEach(id=>$(id).addEventListener('change',()=>{if(!locked)sync()}));
$('music').addEventListener('change',()=>{if(!$('music').checked)stopMusic()});
$('full').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='1'||e.key.toLowerCase()==='a')buzz(1);if(e.key==='2'||e.key.toLowerCase()==='l')buzz(2);if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();reset()}});
sync();
</script>
</body></html>
